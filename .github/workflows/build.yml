name: Build Docker images

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - "master"
    tags:
      - "*.*.*"
  pull_request:
    branches:
      - "master"
    paths-ignore:
      - "**/*.md"
      - ".vscode/**"
      - "images/**"

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

permissions:
  packages: write

jobs:
  mongodb-83:
    name: Build MongoDB 8.3 image
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.OWNER }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hardened Images
        uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ env.OWNER }}
          password: ${{ secrets.DHI_TOKEN }}
      - name: Build and push MongoDB 8.3 image
        uses: docker/build-push-action@v7
        with:
          context: packages/mongodb
          file: packages/mongodb/Dockerfile-8.3
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/mongodb:8.3
          platforms: linux/amd64

  mongodb-83-dev:
    name: Build MongoDB 8.3-dev image
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.OWNER }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hardened Images
        uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ env.OWNER }}
          password: ${{ secrets.DHI_TOKEN }}
      - name: Build and push MongoDB 8.3-dev image
        uses: docker/build-push-action@v7
        with:
          context: packages/mongodb
          file: packages/mongodb/Dockerfile-8.3-dev
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/mongodb:8.3-dev
          platforms: linux/amd64
